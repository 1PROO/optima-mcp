[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optima-mcp"
version = "0.1.0"
description = "Universal, zero-hallucination Neuro-Symbolic Operations Research & Decision Intelligence MCP Server powered by HiGHS and Google OR-Tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ahmed Akram", email = "ahmedakram19@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "operations-research",
    "optimization",
    "highs",
    "ortools",
    "milp",
    "vrp",
    "cp-sat",
    "decision-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mcp[cli]",
    "pulp",
    "highspy",
    "ortools",
    "pandas",
    "openpyxl",
    "pyarrow",
    "pydantic>=2.0",
    "sqlalchemy",
    "httpx",
]

[project.optional-dependencies]
sql = [
    "psycopg2-binary",
    "pymysql",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/1PROO/optima-mcp"
Repository = "https://github.com/1PROO/optima-mcp"
Issues = "https://github.com/1PROO/optima-mcp/issues"

[project.scripts]
optima-mcp = "optima_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/optima_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "optima_mcp/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
